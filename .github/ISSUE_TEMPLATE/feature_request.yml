name: An idea
description: Something Homeport could do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to get done?
      description: Describe the goal rather than the solution; it helps us find the simplest way.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?

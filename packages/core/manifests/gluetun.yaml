id: gluetun
name: VPN gateway (gluetun)
purpose: Routes your download client through your VPN and blocks its traffic if the VPN drops.
category: vpn-gateway
image: qmcgaw/gluetun
tag: latest
capAdd: [NET_ADMIN]
devices: ["/dev/net/tun:/dev/net/tun"]
env:
  # Lets the other apps reach the download client's web page through the gateway.
  FIREWALL_INPUT_PORTS: "8080"
passthroughEnv:
  - VPN_SERVICE_PROVIDER
  - VPN_TYPE
  - WIREGUARD_PRIVATE_KEY
  - WIREGUARD_ADDRESSES
  - WIREGUARD_PUBLIC_KEY
  - WIREGUARD_ENDPOINT_IP
  - WIREGUARD_ENDPOINT_PORT
  - OPENVPN_USER
  - OPENVPN_PASSWORD
  - SERVER_COUNTRIES
ports: []
volumes: []
ramMB: 100

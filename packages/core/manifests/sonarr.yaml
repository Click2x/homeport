id: sonarr
name: Sonarr
purpose: Finds, downloads and organizes TV shows for you.
category: media-manager
image: lscr.io/linuxserver/sonarr
tag: latest
testedVersion: 4.0.20
linuxserver: true
ports:
  - { name: web, container: 8989 }
apiKeyEnv: SONARR__AUTH__APIKEY
volumes:
  - { kind: config, container: /config }
  - { kind: data, container: /data }
ramMB: 400

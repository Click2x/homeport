# Homeport spike: VPN overlay. Used when VPN_SERVICE_PROVIDER is set in .env.
# qBittorrent shares gluetun's network namespace, so it has no other route out:
# if the tunnel drops, gluetun's firewall (the kill switch) drops the traffic.
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      TZ: ${TZ:-UTC}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      WIREGUARD_PUBLIC_KEY: ${WIREGUARD_PUBLIC_KEY:-}
      WIREGUARD_ENDPOINT_IP: ${WIREGUARD_ENDPOINT_IP:-}
      WIREGUARD_ENDPOINT_PORT: ${WIREGUARD_ENDPOINT_PORT:-}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      # Let the other containers reach the qBittorrent web UI through the tunnel container.
      FIREWALL_INPUT_PORTS: "8080"
    ports: ["${PORT_QBIT:-18080}:8080"]

  qbittorrent:
    network_mode: "service:gluetun"
    depends_on: [gluetun]
    ports: !reset []
